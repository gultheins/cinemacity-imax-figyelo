name: Cinema City IMAX figyelő

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: cinemacity-imax-figyelo
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Függőségek telepítése
        run: npm install

      - name: Chromium telepítése
        run: npx playwright install --with-deps chromium

      - name: Cinema City ellenőrzése
        id: monitor
        run: npm run monitor

      - name: Frissített állapot mentése
        if: steps.monitor.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Új IMAX-határdátum: ${{ steps.monitor.outputs.new_date }}"
          git push

      - name: Értesítési issue létrehozása
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NEW_RANGE_START: ${{ steps.monitor.outputs.new_range_start }}
          NEW_DATE: ${{ steps.monitor.outputs.new_date }}
          OLD_DATE: ${{ steps.monitor.outputs.old_date }}
          FIRST_UNAVAILABLE: ${{ steps.monitor.outputs.first_unavailable_date }}
          FINAL_URL: ${{ steps.monitor.outputs.final_url }}
        run: |
          gh issue create \
            --title "Új Odüsszeia IMAX-dátumok: ${NEW_RANGE_START} – ${NEW_DATE}" \
            --assignee "${OWNER}" \
            --body "@${OWNER}

          Új Cinema City Aréna IMAX-dátumok váltak foglalhatóvá az **Odüsszeia** című filmhez.

          - Korábbi legkésőbbi nap: **${OLD_DATE}**
          - Újonnan megnyílt időszak: **${NEW_RANGE_START} – ${NEW_DATE}**
          - Új legkésőbbi nap: **${NEW_DATE}**
          - Első még nem elérhető nap: **${FIRST_UNAVAILABLE}**

          Ellenőrzött oldal: ${FINAL_URL}"

      - name: Hibakeresési képernyőkép feltöltése
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cinemacity-hibakepernyo
          path: debug-error.png
          if-no-files-found: ignore
          retention-days: 7
